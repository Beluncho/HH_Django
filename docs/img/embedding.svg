<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 235" width="460" height="235" role="img"
     aria-label="Близость запроса Python-разработчик к четырём фразам: у hash три фразы дают нулевую близость, у MiniLM значения убывают от 0.6638 до 0.0483"
     font-family="Segoe UI, PT Sans, system-ui, -apple-system, sans-serif">
  <style>
    .val { font-size: 11px; font-weight: 650; fill: #0f2027; }
    .lbl { font-size: 12px; fill: #4d5c66; }
    .leg { font-size: 12px; fill: #22333b; }
    .zero{ font-size: 11px; font-weight: 650; fill: #a32b2b; }
  </style>

  <!-- Легенда -->
  <rect x="14" y="8" width="12" height="10" rx="2" fill="#b9c4cd"/>
  <text class="leg" x="32" y="17">hash</text>
  <rect x="86" y="8" width="12" height="10" rx="2" fill="#203a43"/>
  <text class="leg" x="104" y="17">MiniLM</text>

  <!-- Базовые линии -->
  <line x1="14" y1="180" x2="446" y2="180" stroke="#94a3ae" stroke-width="1.5"/>
  <g stroke="#e7ecf1" stroke-width="1">
    <line x1="14" y1="52.7" x2="446" y2="52.7"/>
    <line x1="14" y1="115" x2="446" y2="115"/>
  </g>
  <g fill="#94a3ae" font-size="10" text-anchor="end">
    <text x="12" y="54">0.65</text>
    <text x="12" y="119">0.33</text>
    <text x="12" y="184">0</text>
  </g>

  <!-- 1: Python / Django — 0.2500 против 0.6638 -->
  <rect x="42" y="131" width="28" height="49" rx="3" fill="#b9c4cd"/>
  <text class="val" x="56" y="127" text-anchor="middle">0.25</text>
  <rect x="76" y="50" width="28" height="130" rx="3" fill="#203a43"/>
  <text class="val" x="90" y="46" text-anchor="middle">0.66</text>
  <text class="lbl" x="75" y="199" text-anchor="middle">Python,</text>
  <text class="lbl" x="75" y="214" text-anchor="middle">Django, ORM</text>

  <!-- 2: CI/CD, Docker — 0 против 0.1761 -->
  <text class="zero" x="161" y="176" text-anchor="middle">0</text>
  <rect x="181" y="146" width="28" height="34" rx="3" fill="#203a43"/>
  <text class="val" x="195" y="142" text-anchor="middle">0.18</text>
  <text class="lbl" x="180" y="199" text-anchor="middle">CI/CD,</text>
  <text class="lbl" x="180" y="214" text-anchor="middle">Docker</text>

  <!-- 3: JS, React — 0 против 0.1165 -->
  <text class="zero" x="266" y="176" text-anchor="middle">0</text>
  <rect x="286" y="157" width="28" height="23" rx="3" fill="#203a43"/>
  <text class="val" x="300" y="153" text-anchor="middle">0.12</text>
  <text class="lbl" x="285" y="199" text-anchor="middle">JS,</text>
  <text class="lbl" x="285" y="214" text-anchor="middle">React</text>

  <!-- 4: PostgreSQL — 0 против 0.0483 -->
  <text class="zero" x="371" y="176" text-anchor="middle">0</text>
  <rect x="391" y="170" width="28" height="10" rx="3" fill="#203a43"/>
  <text class="val" x="405" y="166" text-anchor="middle">0.05</text>
  <text class="lbl" x="390" y="199" text-anchor="middle">PostgreSQL,</text>
  <text class="lbl" x="390" y="214" text-anchor="middle">SQL</text>
</svg>
