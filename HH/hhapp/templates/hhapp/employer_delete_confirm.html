{% extends "base.html" %}

{% block header %}
        <header class="masthead">
            <div class="container px-4 px-lg-5 h-100">
                <div class="row gx-4 gx-lg-5 h-100 align-items-center justify-content-center text-center">
                    <div class="col-lg-8 align-self-end">
                        <h1 class="text-white font-weight-bold">{{ object.employer_name }}</h1>
                        <hr class="divider" />
                    </div>
                    <div class="col-lg-6 col-md-8 align-self-baseline">
                        <div class="card shadow-sm bg-white">
                            <div class="card-body">
                                <h2 class="h4 text-danger mb-3">
                                    <i class="bi bi-exclamation-triangle me-2" aria-hidden="true"></i>Подтвердите удаление
                                </h2>
                                <p class="text-muted mb-4">
                                    Вы уверены, что хотите удалить работодателя
                                    <strong>{{ object.employer_name }}</strong>?
                                    Это действие нельзя отменить.
                                </p>
                                <form method="post">
                                    {% csrf_token %}
                                    <div class="d-flex gap-2 justify-content-center">
                                        <button class="btn btn-danger btn-lg" type="submit">
                                            <i class="bi bi-trash me-2" aria-hidden="true"></i>Удалить
                                        </button>
                                        <a href="{% url 'hhapp:employers_list' %}" class="btn btn-light btn-lg">
                                            Отмена
                                        </a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </header>
{% endblock %}

{% block section_contact %}
<section class="page-section" id="contact">
    <a class="btn btn-light btn-xl" href="{% url 'hhapp:employers_list' %}">
        <i class="bi bi-arrow-left me-2" aria-hidden="true"></i>Работодатели
    </a>
</section>
{% endblock %}
