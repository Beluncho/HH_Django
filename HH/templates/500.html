<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>500 — Ошибка сервера | HH Django</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .min-vh-100 { min-height: 100vh; }
    </style>
</head>
<body>
    <div class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
        <div class="text-center px-4">
            <div class="mb-4">
                <i class="bi bi-x-octagon text-danger" style="font-size: 6rem;" aria-hidden="true"></i>
            </div>
            <h1 class="display-1 fw-bold mb-3">500</h1>
            <h2 class="h3 mb-4">Внутренняя ошибка сервера</h2>
            <p class="lead mb-5 text-muted">
                Что-то пошло не так. Мы уже работаем над исправлением проблемы.<br>
                Пожалуйста, попробуйте позже.
            </p>
            <div class="d-flex gap-3 justify-content-center flex-wrap">
                <a href="/" class="btn btn-primary btn-lg">
                    <i class="bi bi-house-door me-2" aria-hidden="true"></i>На главную
                </a>
                <button onclick="location.reload()" class="btn btn-outline-secondary btn-lg">
                    <i class="bi bi-arrow-clockwise me-2" aria-hidden="true"></i>Обновить
                </button>
            </div>
        </div>
    </div>
</body>
</html>
