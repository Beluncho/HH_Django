{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>404 — Страница не найдена | HH Django</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Merriweather+Sans:400,700" rel="stylesheet" />
    <link href="{% static 'css/styles.css' %}" rel="stylesheet" />
    <link href="{% static 'css/common.css' %}" rel="stylesheet" />
</head>
<body>
    <div class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
        <div class="text-center px-4">
            <div class="mb-4">
                <i class="bi bi-exclamation-triangle text-warning" style="font-size: 6rem;" aria-hidden="true"></i>
            </div>
            <h1 class="display-1 fw-bold mb-3">404</h1>
            <h2 class="h3 mb-4">Страница не найдена</h2>
            <p class="lead mb-5 text-muted">
                К сожалению, запрашиваемая страница не существует или была перемещена.
            </p>
            <div class="d-flex gap-3 justify-content-center flex-wrap">
                <a href="/" class="btn btn-primary btn-lg">
                    <i class="bi bi-house-door me-2" aria-hidden="true"></i>На главную
                </a>
                <button onclick="history.back()" class="btn btn-outline-secondary btn-lg">
                    <i class="bi bi-arrow-left me-2" aria-hidden="true"></i>Назад
                </button>
            </div>
        </div>
    </div>
</body>
</html>
