{% extends "base.html" %}
{% load form_tags %}

{% block header %}
        <!-- Masthead-->
        <header class="masthead">
            <div class="container px-4 px-lg-5 h-100">
                <div class="row gx-4 gx-lg-5 h-100 align-items-center justify-content-center text-center">
                    <div class="col-lg-8 align-self-end">
                        <h1 class="text-white font-weight-bold">LogIn</h1>
                        <hr class="divider" />
                    </div>
                    <div class="col-lg-6 col-md-8 align-self-baseline">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <form method="post">
                                    {% csrf_token %}
                                    {% render_form form submit_text="Войти" submit_class="btn btn-primary btn-lg w-100" %}
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </header>
{% endblock %}

{% block section_contact %}
<section class="page-section" id="contact">
    <a class="btn btn-light btn-xl" href="{% url 'hhapp:index' %}">Home page</a>
</section>
{% endblock %}
