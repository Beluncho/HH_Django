{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Тренажёр кандидата{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'candidate_trainer/css/trainer.css' %}" rel="stylesheet">
</head>
<body>
    <header class="trainer-header">
        <nav class="container trainer-nav" aria-label="Основная навигация">
            <a class="trainer-brand" href="{% url 'candidate_trainer:dashboard' %}">
                <i class="bi bi-compass" aria-hidden="true"></i>
                <span>Тренажёр кандидата</span>
            </a>
            <div class="trainer-nav-actions">
                <a class="btn btn-sm btn-outline-secondary" href="{% url 'hhapp:index' %}">
                    <i class="bi bi-search" aria-hidden="true"></i>
                    Вакансии
                </a>
                <a class="btn btn-sm btn-outline-secondary" href="{% url 'user:profile' pk=user.pk %}">
                    <i class="bi bi-person" aria-hidden="true"></i>
                    Профиль
                </a>
            </div>
        </nav>
    </header>

    <main class="container trainer-main">
        {% if messages %}
            <div class="message-stack" aria-live="polite">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags|default:'secondary' }} mb-2" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
